[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nwrd"
version = "1.0.0"
description = "Wheat stripe-rust segmentation on the NWRD dataset: CANet-B4 against the NWRD paper's baselines"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Syed Muhammad Abdur Rahman" },
    { name = "Abdul Hadi Sheikh" },
    { name = "Abdullah Salim Nizami" },
]
# Versions are bounded to the APIs the code uses; constraints.txt pins the exact set the test
# suite last passed with. The Kaggle runs record theirs in runs/log.txt.
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.4",
    "opencv-python-headless>=4.9",
    "albumentations>=2.0,<3",
    "segmentation-models-pytorch==0.5.0",
    "efficientnet-pytorch==0.7.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "kaggle>=1.6",
]
docs = [
    "markdown>=3.5",
    "pymupdf>=1.24",
]

[tool.setuptools]
packages = ["nwrd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs of the pipeline on CPU (minutes); deselect with -m 'not slow'",
]
filterwarnings = [
    "ignore::DeprecationWarning:efficientnet_pytorch.*",
    # Newer Starlette asks for httpx2 in its test client; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "app/frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Its long lines are the notebooks' own cell text (markdown and Kaggle code), not repository code.
"scripts/build_notebooks.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nwrd"]

[tool.ruff.format]
quote-style = "single"
